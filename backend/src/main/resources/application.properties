# ============================================================================
# P_174 — Occupational Safety & Health Monitoring System Configuration
# ============================================================================

server.port=8080

# ── Spring Datasource (PostgreSQL with local H2 fallback capability) ─────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/safety_wearable_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shahabahmad}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Auto-initialize schema & baseline seed data
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# ── MQTT Broker Configuration (HiveMQ / Mosquitto compatible) ───────────────
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=${MQTT_CLIENT_ID:SafetyWearableBackend}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.topic.telemetry.filter=safetywearable/+/telemetry
mqtt.topic.status.filter=safetywearable/+/status
mqtt.topic.alert.filter=safetywearable/+/alert

# ── Safety Thresholds & Alert Persistence Configuration ─────────────────────
# Documented as configurable prototype safety limits (not diagnostic medical dogma)
safety.threshold.heart-rate.max=110
safety.threshold.spo2.min=92
safety.threshold.temperature.max=38.0

# Alert Debounce Window (Condition must persist this many seconds)
safety.alert.persistence.seconds=15

# Alert Cooldown Window (Prevents repetitive notification spam)
safety.alert.cooldown.seconds=60

# Device Offline Watchdog Timeout (Mark device OFFLINE if inactive)
safety.device.offline.timeout.seconds=30
